<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- The app's brand gold, so the home-screen icon and the header crest
         read as the same product. -->
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F2C948"/>
      <stop offset="100%" stop-color="#D9A720"/>
    </linearGradient>
  </defs>

  <!-- Full-bleed background: a maskable icon is cropped to a circle on
       Android, and anything transparent at the edges becomes a hard corner. -->
  <rect width="1024" height="1024" fill="url(#g)"/>

  <!-- The mark sits inside the middle 60% so the circular mask never clips it. -->
  <g transform="translate(512 512)" fill="none" stroke="#1A1204" stroke-width="34"
     stroke-linecap="round" stroke-linejoin="round">
    <circle r="210"/>
    <path d="M0 -118 96 -48 59 66 -59 66 -96 -48Z" fill="#1A1204" stroke-width="28"/>
    <path d="M0 -210V-118M96 -48l90-62M59 66l58 106M-59 66l-58 106M-96 -48l-90-62"/>
  </g>
</svg>
