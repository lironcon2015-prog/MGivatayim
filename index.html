<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>מכבי גבעתיים — העונה</title>
<meta name="description" content="כל העונה של מכבי גבעתיים במקום אחד: המשחק הבא, תוצאות, נתוני שחקנים, סרטונים וקישורים." />
<meta name="theme-color" content="#0E1A2C" />

<link rel="icon" type="image/png" sizes="32x32" href="./icons/favicon-32.png" />
<link rel="icon" type="image/png" sizes="16x16" href="./icons/favicon-16.png" />
<link rel="shortcut icon" href="./icons/favicon.ico" />
<link rel="apple-touch-icon" sizes="180x180" href="./icons/apple-touch-icon.png" />
<link rel="manifest" href="./manifest.webmanifest" />

<link rel="stylesheet" href="./styles.css" />
<!-- The fonts, asked for with the stylesheet. Otherwise a font is fetched
     only once text using it is laid out: the home screen drew in the
     fallback font, then swapped, and a button measured in the narrower
     fallback kept its label broken over two lines ("ב-" / "Waze").
     tests/pwa.mjs fails if one is missing. -->
<link rel="preload" as="font" type="font/woff2" crossorigin href="./assets/fonts/assistant-hebrew.woff2" />
<link rel="preload" as="font" type="font/woff2" crossorigin href="./assets/fonts/assistant-latin.woff2" />
<link rel="preload" as="font" type="font/woff2" crossorigin href="./assets/fonts/rubik-hebrew.woff2" />
<link rel="preload" as="font" type="font/woff2" crossorigin href="./assets/fonts/rubik-latin.woff2" />
<!-- Every module, fetched side by side from the start. Without this the
     browser found them one import at a time — app.js, then what it imports,
     then what those import — a round trip each: to the server on a first
     open, and a trip through the service worker's copy on every other.
     tests/pwa.mjs fails if one is missing. -->
<link rel="modulepreload" href="./src/app.js" />
<link rel="modulepreload" href="./src/bridge.js" />
<link rel="modulepreload" href="./src/components.js" />
<link rel="modulepreload" href="./src/config.js" />
<link rel="modulepreload" href="./src/fixtures.js" />
<link rel="modulepreload" href="./src/format.js" />
<link rel="modulepreload" href="./src/gallery.js" />
<link rel="modulepreload" href="./src/icons.js" />
<link rel="modulepreload" href="./src/imaging.js" />
<link rel="modulepreload" href="./src/importer.js" />
<link rel="modulepreload" href="./src/install.js" />
<link rel="modulepreload" href="./src/lineup-text.js" />
<link rel="modulepreload" href="./src/live/model.js" />
<link rel="modulepreload" href="./src/live/sync.js" />
<link rel="modulepreload" href="./src/minutes.js" />
<link rel="modulepreload" href="./src/positions.js" />
<link rel="modulepreload" href="./src/posters.js" />
<link rel="modulepreload" href="./src/season.js" />
<link rel="modulepreload" href="./src/store.js" />
<link rel="modulepreload" href="./src/trainings.js" />
<link rel="modulepreload" href="./src/ui/sheet.js" />
<link rel="modulepreload" href="./src/updater.js" />
<link rel="modulepreload" href="./src/views/admin.js" />
<link rel="modulepreload" href="./src/views/gallery.js" />
<link rel="modulepreload" href="./src/views/gate.js" />
<link rel="modulepreload" href="./src/views/home.js" />
<link rel="modulepreload" href="./src/views/live.js" />
<link rel="modulepreload" href="./src/views/media.js" />
<link rel="modulepreload" href="./src/views/minutes.js" />
<link rel="modulepreload" href="./src/views/stats.js" />
<!-- The running version. `node tools/bump.mjs` rewrites it together with
     version.json and sw.js; the updater compares it with version.json. -->
<script>window._BUNDLE_VERSION = '1.49.0';</script>
</head>
<body>
  <div id="app"></div>
  <noscript>
    <main class="shell"><section><div class="card">
      <h2>צריך JavaScript</h2>
      <p class="note">הדף מחשב את נתוני העונה בדפדפן. יש להפעיל JavaScript כדי לראות אותו.</p>
    </div></section></main>
  </noscript>
  <script type="module" src="./src/app.js"></script>
</body>
</html>
