<link rel="stylesheet" href="./styles.css?v=1.89.1" />
<!-- The fonts, asked for with the stylesheet. Otherwise a font is fetched
     only once text using it is laid out: the home screen drew in the
     fallback font, then swapped, and a button measured in the narrower
     fallback kept its label broken over two lines ("ב-" / "Waze").
     tests/pwa.mjs fails if one is missing. -->
<link rel="preload" as="font" type="font/woff2" crossorigin href="./assets/fonts/assistant-hebrew.woff2" />
<link rel="preload" as="font" type="font/woff2" crossorigin href="./assets/fonts/assistant-latin.woff2" />
<link rel="preload" as="font" type="font/woff2" crossorigin href="./assets/fonts/rubik-hebrew.woff2" />
<link rel="preload" as="font" type="font/woff2" crossorigin href="./assets/fonts/rubik-latin.woff2" />
<!-- Every module under its version's address, imports inside modules too.
     At the plain address an iPhone kept running the last release's modules
     from memory after the update's reload: the footer (index.html) showed the
     new version, the screens were the old ones until the app was closed and
     opened again. `node tools/bump.mjs` rewrites every ?v=; tests/pwa.mjs
     fails if a module is missing here. -->
<script type="importmap">
{ "imports": {
  "./src/app.js": "./src/app.js?v=1.89.1",
  "./src/bridge.js": "./src/bridge.js?v=1.89.1",

  "./src/icons.js": "./src/icons.js?v=1.89.1",
  "./src/imaging.js": "./src/imaging.js?v=1.89.1",
  "./src/importer.js": "./src/importer.js?v=1.89.1",
  "./src/install.js": "./src/install.js?v=1.89.1",
  "./src/lineup-text.js": "./src/lineup-text.js?v=1.89.1",
  "./src/live/model.js": "./src/live/model.js?v=1.89.1",
  "./src/live/sync.js": "./src/live/sync.js?v=1.89.1",
  "./src/minutes.js": "./src/minutes.js?v=1.89.1",
  "./src/positions.js": "./src/positions.js?v=1.89.1",
  "./src/posters.js": "./src/posters.js?v=1.89.1",
  "./src/season.js": "./src/season.js?v=1.89.1",
  "./src/store.js": "./src/store.js?v=1.89.1",
  "./src/trainings.js": "./src/trainings.js?v=1.89.1",
  "./src/ui/sheet.js": "./src/ui/sheet.js?v=1.89.1",
  "./src/updater.js": "./src/updater.js?v=1.89.1",
  "./src/views/admin.js": "./src/views/admin.js?v=1.89.1",
  "./src/views/gallery.js": "./src/views/gallery.js?v=1.89.1",
  "./src/views/gate.js": "./src/views/gate.js?v=1.89.1",
  "./src/views/home.js": "./src/views/home.js?v=1.89.1",
  "./src/views/live.js": "./src/views/live.js?v=1.89.1",
  "./src/views/media.js": "./src/views/media.js?v=1.89.1",
  "./src/views/minutes.js": "./src/views/minutes.js?v=1.89.1",
  "./src/views/stats.js": "./src/views/stats.js?v=1.89.1"
} }
</script>
<!-- Every module, fetched side by side from the start. Without this the
     browser found them one import at a time — app.js, then what it imports,
     then what those import — a round trip each: to the server on a first
     open, and a trip through the service worker's copy on every other.
     tests/pwa.mjs fails if one is missing. -->
